include:
  - project: "tol/tol-core"
    ref: v1.7.0
    file: "/gitlab/app.yml"

variables:
  APP_NAME: components
  DISABLE_UI_LINT: "true"

build-package-dummy:
  # prevents the accumulation of errors on `yarn build`
  stage: deploy
  image: node:18-alpine
  script:
    - cd components-ui/app/src/tol-ui
    - yarn install
    - yarn build
  except:
    - qa
    - staging
    - production
  needs:
    - job: review_app
      optional: true
    - job: build-ui-dev
      optional: true

deploy-package:
  stage: deploy
  image: node:18-alpine
  script:
    - |
      {
        echo "@${CI_PROJECT_ROOT_NAMESPACE}:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "${CI_API_V4_URL#https?}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
      } | tee -a .npmrc
    - cd components-ui/app/src/tol-ui
    - yarn install
    - yarn build
    - yarn publish
  when: manual
  needs: []

deploy-doc:
  stage: lint
  image: node:18-alpine
  before_script:
    - apk add --no-cache python3 py3-pip make gcc musl-dev python3-dev git
    - python3 -m venv /venv
    - . /venv/bin/activate
    - pip install sphinx sphinx-rtd-theme sphinx-js myst_parser
    - yarn global add typescript typedoc
  script:
    - cd components-ui/app/src/tol-ui
    - yarn install
    - yarn build
    - sphinx-build -b html doc/source .public
    - ls -al .public
    - mv .public ${CI_PROJECT_DIR}/public
  pages:
    publish: public
  # only:
  #   - production
